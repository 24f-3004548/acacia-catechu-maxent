[project]
name = "acacia-catechu-maxent"
version = "0.1.0"
description = "MaxEnt habitat suitability model for Acacia catechu in India"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
geo = [
  "rasterio>=1.4,<2",
  "geopandas>=1.0,<2",
  "shapely>=2.0,<3",
  "pyproj>=3.6,<4",
  "libarchive-c>=5,<6",
]
model = [
  "elapid>=1.0,<2",
  "scikit-learn>=1.5,<2",
  "rasterio>=1.4,<2",
  "geopandas>=1.0,<2",
  "shapely>=2.0,<3",
  "pyproj>=3.6,<4",
  "libarchive-c>=5,<6",
]

notebooks = ["ipykernel>=6.29,<8"]
earthengine = ["earthengine-api>=1,<2"]

[tool.uv]
package = false

[tool.pyright]
extraPaths = ["scripts"]

